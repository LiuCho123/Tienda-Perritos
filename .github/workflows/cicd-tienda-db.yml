name: CI/CD Tienda - DB
on:
  push:
    paths: [ "db/**" ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1
    - name: Build and Push image
      run: |
        docker build -t ${{ secrets.ECR_REPO_URL_DB }}:latest ./db
        docker push ${{ secrets.ECR_REPO_URL_DB }}:latest [cite: 306, 307]
    - name: Deploy to EC2 via SSM
      run: |
        aws ssm send-command --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} --document-name "AWS-RunShellScript" --parameters 'commands=["aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}", "docker pull ${{ secrets.ECR_REPO_URL_DB }}:latest", "docker stop tienda-db || true", "docker rm tienda-db || true", "docker run -d --name tienda-db -p 3306:3306 -v dbdata:/var/lib/mysql ${{ secrets.ECR_REPO_URL_DB }}:latest"]'